[project]
name = "llamacpp-deploy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sanju Sabu", email = "sanjusabu.self@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "llama-cpp-python>=0.3.36",
    "python-dotenv>=1.2.4",
]

[project.scripts]
llamacpp-deploy = "llamacpp_deploy:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "llamacpp_deploy.main:app"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
